<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LMS Portal{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- LMS Top Navbar -->
  <nav class="bg-indigo-600 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="{% url 'course_list' %}" class="text-xl font-bold tracking-tight flex items-center gap-2">
        🎓 TechExe LMS
      </a>

      <!-- Navigation & User Auth Area -->
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="{% url 'course_list' %}" class="hover:text-indigo-200 transition">
          Courses
        </a>

        {% if user.is_authenticated %}
          <!-- User Profile Badge -->
          <div class="flex items-center gap-2 bg-indigo-700/60 px-3 py-1.5 rounded-full border border-indigo-500/30">
            <span class="text-xs">👤</span>
            <span class="text-xs font-semibold">
              {% if user.get_full_name %}{{ user.get_full_name }}{% else %}{{ user.username }}{% endif %}
            </span>
          </div>
          
          <!-- Django 5/6 Compliant POST Logout Form -->
          <form action="{% url 'logout' %}" method="post" class="inline">
            {% csrf_token %}
            <button type="submit" class="text-xs text-indigo-200 hover:text-white underline ml-2 bg-transparent border-0 cursor-pointer p-0">
              Logout
            </button>
          </form>

        {% else %}
          <!-- Central ICCBS Login Link -->
          <a href="/iccbs/login/?next={% url 'course_list' %}" class="bg-white text-indigo-600 px-4 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-50 transition">
            Login
          </a>
        {% endif %}
      </div>

    </div>
  </nav>

  <!-- Main Content Body -->
  <main class="flex-1">
    {% block content %}
    <!-- Page content will inject here -->
    {% endblock %}
  </main>

  <!-- LMS Footer -->
  <footer class="bg-white border-t py-6 text-center text-xs text-gray-500 mt-auto">
    &copy; {% now "Y" %} TechExe LMS. All rights reserved.
  </footer>

</body>
</html>
