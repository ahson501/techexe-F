{% extends "LMS/base.html" %}

{% block title %}Invite Faculty | TechExe LMS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">👥 Send Faculty Invitation</h1>
    <p class="text-xs text-gray-500 mb-6">Invite permanent instructors or visiting faculty to join the department catalog.</p>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="faculty@university.edu.pk" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Faculty Category</label>
        <select name="faculty_type" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="PERMANENT">Permanent Instructor (LMS_Instructor)</option>
          <option value="VISITING" selected>Visiting Faculty (LMS_VistingFaculty)</option>
        </select>
      </div>

      <div class="pt-4 flex justify-end space-x-3">
        <a href="{% url 'hod_dashboard' %}" class="px-4 py-2 text-xs font-bold text-gray-600 hover:text-gray-800">Cancel</a>
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-5 py-2 rounded-lg transition">
          Send Invitation →
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
