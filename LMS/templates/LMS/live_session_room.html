{% extends "LMS/base.html" %}

{% block title %}Live Stream: {{ session.title }} - TechExe LMS{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-6">
  
  <!-- Navigation Header -->
  <div class="mb-4 flex items-center justify-between">
    <div>
      <a href="{% url 'course_detail' course.slug %}" class="text-xs text-indigo-600 font-semibold hover:underline">
        ← Back to {{ course.title }}
      </a>
      <h1 class="text-2xl font-bold text-gray-900 mt-1">🔴 Live: {{ session.title }}</h1>
    </div>
    <span class="bg-red-100 text-red-700 text-xs font-bold px-3 py-1.5 rounded-full animate-pulse">
      LIVE CLASSROOM
    </span>
  </div>

  <!-- Main Container: Embedded Classroom Stream -->
  <div class="bg-black rounded-xl overflow-hidden shadow-2xl h-[650px] w-full relative">
    <div id="jitsi-container" class="w-full h-full"></div>
  </div>

</div>

<!-- Jitsi Meet Iframe Script -->
<script src="https://meet.jit.si/external_api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const domain = "meet.jit.si";
    const options = {
      roomName: "TechExe-LMS-Course-{{ course.id }}-Session-{{ session.id }}",
      width: "100%",
      height: "100%",
      parentNode: document.querySelector('#jitsi-container'),
      userInfo: {
        displayName: "{{ user_display_name }}"
      },
      configOverwrite: {
        startWithAudioMuted: true,
        disableDeepLinking: true
      },
      interfaceConfigOverwrite: {
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'desktop', 'chat', 
          'raisehand', 'tileview', 'fullscreen'
        ]
      }
    };
    const api = new JitsiMeetExternalAPI(domain, options);
  });
</script>
{% endblock %}
