{% extends "LMS/base.html" %}

{% block title %}Access Restricted | TechExe LMS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-16 text-center">
  <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
    <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
      🚫
    </div>
    
    <h1 class="text-2xl font-extrabold text-gray-900 mb-2">Access Denied</h1>
    <p class="text-sm text-gray-600 mb-6">
      {{ reason|default:"You do not have permission to view this live session or module." }}
    </p>

    <div class="flex justify-center space-x-4">
      <a href="{% url 'course_list' %}" class="bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow transition">
        Browse Courses
      </a>
      <a href="{% url 'student_dashboard' %}" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow transition">
        Go to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
