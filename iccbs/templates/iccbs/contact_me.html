{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="{% static 'frontend/dist/assets/iccbs-CDR8rDBf.css' %}">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Contact Me</h1>
            <p>Feel free to reach out for any queries or collaborations!</p>
        </div>
    </header>

    <main class="contact-form-container">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your Full Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Your Message" required></textarea>
            </div>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 ICCBS. All rights reserved.</p>
    </footer>
</body>
</html>
