{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ICCBS Login Portal{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'frontend/dist/assets/iccbs-CDR8rDBf.css' %}">
</head>
<body>

    <header>
        <style>
            .d-none { display: none; }
          </style><h1 class="d-none">Welcome ICCBS Login Portal</h1>
        <h1>Welcome to Syscon Login Portal</h1>
        <nav>
            <ul>
                <li><a href="{% url 'iccbs:iccbs_login' %}">Login</a></li>
                <li><a href="{% url 'iccbs:iccbs_logout' %}">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="portal-hero-wrapper">
        <img src="{% static 'images/services/LEJ.jpeg' %}" alt="ICCBS Portal Backdrop" class="portal-hero-bg d-none">
        <img src="{% static 'images/services/SySlogin.png' %}" alt="ICCBS Portal Backdrop" class="portal-hero-bg">
        <main>
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <footer>
        <p class="d-none">&copy; 2026 ICCBS</p>
        <p>&copy; 2026 SysconTechnologies</p>
    </footer>

</body>
</html>
