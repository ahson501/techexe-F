<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - TechExe LMS</title>
</head>
<body>
    <div class="password-change-container">
        <h2>Change Your Password</h2>
        <p>This is your first login. For security reasons, you must change your initial password before proceeding.</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Update Password</button>
        </form>
    </div>
</body>
</html>
