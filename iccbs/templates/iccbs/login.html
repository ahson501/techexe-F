{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'frontend/dist/assets/iccbs-CDR8rDBf.css' %}">
    <!-- ICCBS Logo Loader CSS -->
    <style>
        .iccbs-loader {
            --ring-size: 200px;
            --logo-size: 110px;
            --ring-color: #009688;
            --ring-rgb: 255, 59, 0;   /* same colour as R, G, B (used for glow) */

            position: relative;
            box-sizing: border-box;
            width: var(--ring-size);
            height: var(--ring-size);
            display: grid;
            place-items: center;
            margin: 10px auto 20px;
            isolation: isolate;
        }

        /* Bright arc that circles the outer ring */
        .iccbs-loader::after {
            content: "";
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--ring-color);
            animation: iccbs-spin 3s linear infinite;
            pointer-events: none;
        }

        /* Spinning ring that carries the letters */
        .iccbs-loader-ring {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border: 2px solid rgba(var(--ring-rgb), 0.35);
            border-radius: 50%;
            animation: iccbs-spin 16s linear infinite;
            will-change: transform;
        }

        /* Each letter: full-size box rotated around the exact centre.
           Monospace font gives every letter the same width, so gaps stay even. */
        .iccbs-loader-ring span {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            margin: 0;
            padding-top: 6px;
            display: flex;
            justify-content: center;
            align-items: flex-start;

            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            color: var(--ring-color);

            transform-origin: 50% 50%;
            transform: rotate(calc(var(--i) * 360deg / var(--n)));
        }

        /* Logo: "cover" fills the whole circle, so no gap at the top or bottom */
        .iccbs-loader-logo {
            position: relative;
            z-index: 1;
            display: block;
            flex: none;
            margin: 0;
            padding: 0;
            width: var(--logo-size);
            height: var(--logo-size);
            min-width: var(--logo-size);
            min-height: var(--logo-size);
            max-width: none;
            max-height: none;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            border-radius: 50%;
            background: transparent;
            box-shadow: 0 0 0 2px rgba(var(--ring-rgb), 0.35),
                        0 6px 20px rgba(var(--ring-rgb), 0.25);
            animation: iccbs-glow 3s ease-in-out infinite;
        }

        @keyframes iccbs-spin {
            to { transform: rotate(360deg); }
        }

        @keyframes iccbs-glow {
            50% {
                box-shadow: 0 0 0 2px rgba(var(--ring-rgb), 0.5),
                            0 6px 28px rgba(var(--ring-rgb), 0.45);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .iccbs-loader::after,
            .iccbs-loader-ring,
            .iccbs-loader-logo {
                animation: none;
            }
        }

        @media (max-width: 480px) {
            .iccbs-loader {
                --ring-size: 170px;
                --logo-size: 95px;
            }

            .iccbs-loader-ring span {
                font-size: 10px;
                padding-top: 4px;
            }
        }
    </style>
</head>

<body class="login-page">
    <div class="login-container">
        <!-- ICCBS Logo with Animated Text Ring -->
        <div class="iccbs-loader">

            <!-- "SySCon • EduCore • " repeated twice = 38 slots (spaces are empty slots).
                 --n must always equal the total number of slots, so the letters close the circle evenly. -->
            <div class="iccbs-loader-ring"
                 aria-hidden="true"
                 style="--n: 38">

                <span style="--i:0">S</span>
                <span style="--i:1">Y</span>
                <span style="--i:2">S</span>
                <span style="--i:3">C</span>
                <span style="--i:4">O</span>
                <span style="--i:5">N</span>
                <span style="--i:6"></span>
                <span style="--i:7">P</span>
                <span style="--i:8">O</span>
                <span style="--i:9">R</span>
                <span style="--i:10">T</span>
                <span style="--i:11">A</span>
                <span style="--i:12">L</span>

                <span style="--i:16">•</span>
                <span style="--i:17">S</span>
                <span style="--i:18">Y</span>
                <span style="--i:19">S</span>
                <span style="--i:20">C</span>
                <span style="--i:21">O</span>
                <span style="--i:22">N</span>
                <span style="--i:23"></span>
                <span style="--i:24">P</span>
                <span style="--i:25">O</span>
                <span style="--i:26">R</span>
                <span style="--i:27">T</span>
                <span style="--i:28">A</span>
                <span style="--i:29">L</span>

            </div>

            <img
                class="iccbs-loader-logo"
                src="{% static 'images/services/SySLogo.png' %}"
                alt="International Center for Chemical and Biological Sciences"
            >

        </div>
          <h2 ></h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username..." required>
            <input type="password" name="password" placeholder="Password..." required>
            <button type="submit">Sign in</button>
        </form>
        <div class="login-links relative z-10" style="pointer-events: auto;">
            {% if user.is_authenticated %}
              <!-- Shown ONLY to users who are ALREADY logged in -->
              <a href="{% url 'iccbs:password_change' %}" 
                 class="btn btn-outline-primary text-xs font-bold rounded-xl relative z-20">
                  🔒 Change My Password
              </a>
              <a href="{% url 'iccbs:iccbs_login' %}" class="ms-2 text-xs">
                  Go to Dashboard →
              </a>
            {% else %}
              <!-- Shown to unauthenticated public visitors -->
              <a href="{% url 'iccbs:password_reset' %}" 
                 class="btn btn-outline-secondary text-xs font-bold rounded-xl relative z-20">
                  🔑 Forgot Password?
              </a>
              <a href="{% url 'iccbs:register' %}" class="ms-2 text-xs">
                  Register yourself
              </a>
            {% endif %}
          </div>
</body>
</html>
